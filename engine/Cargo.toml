[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"
publish = false

[workspace.dependencies]
lucky-ffmpeg-sys = { path = "crates/lucky-ffmpeg-sys" }
lucky-ffmpeg = { path = "crates/lucky-ffmpeg" }
lucky-player = { path = "crates/lucky-player" }
lucky-render = { path = "crates/lucky-render" }
lucky-android = { path = "crates/lucky-android" }
lucky-ass = { path = "crates/lucky-ass" }
jni = "0.22"
log = "0.4"
android_logger = "0.15"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bindgen = "0.73"
cc = "1"
glow = "0.18"
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
incremental = false

[profile.dev]
opt-level = 2
